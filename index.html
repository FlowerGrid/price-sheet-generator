<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Western Rewind — Pricing Sheet Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root {
    --bg:        #FAFAF8;
    --ink:       #111111;
    --gold:      #C9A84C;
    --gold-dark: #8A6F2E;
    --gold-pale: #F5EDD6;
    --rule:      #DDD8CC;
    --muted:     #7A7060;
    --footer:    #3A3020;
    --fill:      #F2EDE2;

    /* app chrome tokens — distinct from the sheet itself, echoes the western/rewind cue quietly */
    --app-bg:    #EFEAE0;
    --app-ink:   #1B1712;
    --app-line:  #D8D0BE;
    --app-accent: #8A6F2E;
    --app-accent-soft: #F5EDD6;
    --danger: #9B3B2E;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--app-bg); }
  body {
    font-family: 'Courier Prime', monospace;
    color: var(--app-ink);
    min-height: 100vh;
    padding-bottom: 96px; /* room for sticky export bar */
  }

  /* ── APP HEADER ── */
  .app-header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--app-bg);
    border-bottom: 1px solid var(--app-line);
    padding: 14px 16px 0;
  }
  .app-title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .app-title {
    font-family: serif;
    font-size: 17px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .app-title span { color: var(--app-accent); }
  .app-subtitle {
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ── SEGMENTED TABS ── */
  .tabs {
    display: flex;
    gap: 4px;
    background: #E3DCC8;
    border-radius: 8px;
    padding: 3px;
    margin-bottom: 12px;
  }
  .tab-btn {
    flex: 1;
    border: none;
    background: transparent;
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 9px 0;
    border-radius: 6px;
    color: var(--muted);
    cursor: pointer;
  }
  .tab-btn.active {
    background: var(--app-ink);
    color: var(--app-bg);
  }

  /* ── EDIT PANEL ── */
  .panel { display: none; padding: 4px 16px 24px; }
  .panel.active { display: block; }

  .edit-section {
    margin-top: 18px;
  }
  .edit-section:first-child { margin-top: 6px; }

  .edit-section-title {
    font-family: serif;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--app-ink);
  }

  .section-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
    flex-shrink: 0;
  }
  .section-toggle input { accent-color: var(--app-accent); width: 15px; height: 15px; }

  .edit-section.section-off .edit-section-title { color: var(--muted); }
  .edit-section.section-off .item-card {
    opacity: 0.4;
    pointer-events: none;
  }
  .edit-section.section-off .add-item-btn {
    opacity: 0.4;
    pointer-events: none;
  }

  .item-card {
    background: #fff;
    border: 1px solid var(--app-line);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .item-card.hidden-row { opacity: 0.5; }

  .item-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px 10px;
    margin-bottom: 8px;
  }

  .move-btn-group {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }
  .move-btn {
    width: 26px;
    height: 26px;
    border: 1px solid var(--app-line);
    background: #fff;
    border-radius: 5px;
    color: var(--app-ink);
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .move-btn:active:not(:disabled) { background: var(--app-accent-soft); }
  .move-btn:disabled {
    opacity: 0.3;
    cursor: default;
  }

  .edit-section-title-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 6px 10px;
    margin-bottom: 6px;
  }

  .edit-section-toggles-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px 16px;
    padding-bottom: 8px;
    border-bottom: 1.5px solid var(--app-ink);
    margin-bottom: 10px;
  }

  .remove-item-btn {
    flex-shrink: 0;
    background: none;
    border: none;
    color: var(--danger);
    font-family: 'Courier Prime', monospace;
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px 0;
  }

  .add-item-btn {
    display: block;
    width: 100%;
    margin-top: 4px;
    background: #fff;
    border: 1.5px dashed var(--app-line);
    color: var(--app-accent);
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 11px 0;
    border-radius: 7px;
    cursor: pointer;
  }
  .add-item-btn:active { background: var(--app-accent-soft); }

  .field-label {
    font-size: 8.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    display: block;
    margin-bottom: 3px;
  }

  .field-input, .field-textarea {
    width: 100%;
    font-family: 'Courier Prime', monospace;
    font-size: 13px;
    color: var(--app-ink);
    border: 1px solid var(--app-line);
    border-radius: 5px;
    padding: 8px 9px;
    background: #FCFBF8;
  }
  .field-input:focus, .field-textarea:focus {
    outline: none;
    border-color: var(--app-accent);
    background: #fff;
  }
  .field-textarea { resize: none; min-height: 44px; line-height: 1.4; }

  .field-input-error {
    border-color: var(--danger) !important;
    background: #FBF0EE !important;
  }
  .field-input-error:focus {
    border-color: var(--danger) !important;
  }
  .field-error-text {
    color: var(--danger);
    font-size: 9px;
    line-height: 1.4;
    margin-top: 5px;
  }

  .field-row { margin-bottom: 8px; }
  .field-row:last-child { margin-bottom: 0; }
  .field-row-split {
    display: grid;
    grid-template-columns: 1fr 110px;
    gap: 8px;
  }

  .price-input-wrap { position: relative; }
  .price-input-wrap .field-input { padding-left: 20px; }
  .price-input-wrap::before {
    content: "$";
    position: absolute;
    left: 9px;
    top: 8px;
    font-size: 13px;
    color: var(--muted);
  }

  .visibility-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .visibility-toggle input { accent-color: var(--app-accent); width: 14px; height: 14px; }

  .notes-edit {
    background: #fff;
    border: 1px solid var(--app-line);
    border-radius: 8px;
    padding: 12px;
  }
  .notes-edit textarea { min-height: 90px; }

  .locked-hint {
    font-size: 9px;
    color: var(--muted);
    line-height: 1.6;
    background: var(--app-accent-soft);
    border-left: 2px solid var(--app-accent);
    padding: 8px 10px;
    margin: 4px 0 16px;
  }

  .global-toggle-card {
    background: #fff;
    border: 1px solid var(--app-line);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 18px;
  }
  .global-toggle {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    cursor: pointer;
  }
  .global-toggle input {
    accent-color: var(--app-accent);
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .global-toggle-title {
    display: block;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--app-ink);
    font-weight: 700;
  }
  .global-toggle-sub {
    display: block;
    font-size: 9.5px;
    color: var(--muted);
    line-height: 1.5;
    margin-top: 2px;
  }

  .header-note-position {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--app-line);
  }
  .header-note-position-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 6px;
  }

  .reset-row {
    margin-top: 22px;
    text-align: center;
  }
  .reset-btn {
    background: none;
    border: none;
    color: var(--danger);
    font-family: 'Courier Prime', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: underline;
    cursor: pointer;
  }

  /* ── PREVIEW PANEL ── */
  #preview-panel.panel { padding: 14px 12px 24px; }

  .preview-frame {
    background: #ddd8c8;
    border-radius: 10px;
    padding: 16px 0;
    display: flex;
    justify-content: center;
    overflow: hidden;
  }

  .scale-wrap {
    transform-origin: top center;
  }

  /* ===== SHEET STYLES (mirrors source template exactly; do not alter) ===== */
  .sheets-container {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .sheet {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Courier Prime', monospace;
    width: 816px;
    height: 1056px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.18);
    box-sizing: border-box;
    overflow: visible; /* never silently clip — a measurement edge-case should overflow visibly, not vanish */
    position: relative;
  }
  .page-number {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 26px;
    text-align: center;
    font-family: 'Courier Prime', monospace;
    font-size: 8px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .sheet + .sheet {
    margin-top: 28px; /* visual gap between pages in preview; zeroed out during export */
  }
  .sheet-page-break {
    page-break-before: always;
    break-before: page;
  }
  .page-wrap {
    height: 100%;
    box-sizing: border-box;
    padding: 56px 72px 56px;
    display: flex;
    flex-direction: column;
  }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 20px; border-bottom: 2px solid var(--ink); margin-bottom: 14px;
    flex-shrink: 0;
  }
  .mini-header {
    text-align: right;
    margin-bottom: 24px;
    flex-shrink: 0;
  }
  .mini-header-title { font-family: 'Playfair Display', serif; font-style: italic; font-size: 13px; color: var(--ink); line-height: 1.1; }
  .mini-header-sub { font-family: 'Courier Prime', monospace; font-size: 7px; letter-spacing: 0.18em; color: var(--muted); text-transform: uppercase; margin-top: 3px; }
  .header-note-banner {
    font-family: 'Courier Prime', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--ink);
    text-align: center;
    margin: 0 0 18px;
    flex-shrink: 0;
  }
  .header-note-banner.header-note-big {
    font-size: 14px;
  }
  .sheet-sections-col {
    flex-shrink: 0;
  }
  .footer-group {
    margin-top: auto; /* pins this group to the bottom of the page it's on */
    flex-shrink: 0;
  }
  .logo-block { flex-shrink: 0; }
  .logo-image {
    display: block;
    height: 90px;
    width: auto;
    max-width: 260px;
    object-fit: contain;
    object-position: left center;
  }
  .logo-tagline { font-family: 'Courier Prime', monospace; font-size: 9px; letter-spacing: 0.28em; color: var(--muted); text-transform: uppercase; margin-top: 6px; }
  .header-right { text-align: right; }
  .doc-label { font-family: 'Playfair Display', serif; font-style: italic; font-size: 22px; color: var(--ink); line-height: 1.1; margin-bottom: 4px; }
  .doc-sub { font-family: 'Courier Prime', monospace; font-size: 9px; letter-spacing: 0.22em; color: var(--muted); text-transform: uppercase; }

  .section { margin-bottom: 18px; }
  .section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .section-label { font-family: serif; font-size: 13px; letter-spacing: 0.18em; color: var(--ink); text-transform: uppercase; flex-shrink: 0; }
  .section-rule { flex: 1; height: 1px; background: var(--rule); }
  .section-starting-at {
    font-family: 'Courier Prime', monospace;
    font-size: 8.5px;
    letter-spacing: 0.16em;
    color: var(--muted);
    text-transform: uppercase;
    flex-shrink: 0;
  }

  .pricing-table { width: 100%; border-collapse: collapse; }
  .pricing-table tr { border-bottom: 1px solid var(--rule); }
  .pricing-table tr:last-child { border-bottom: none; }
  .pricing-table td { padding: 7px 10px 7px 0; vertical-align: top; }
  .pricing-table td:last-child { padding-right: 0; text-align: right; white-space: nowrap; }

  .item-name { font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 11px; letter-spacing: 0.04em; color: var(--ink); line-height: 1.3; }
  .item-desc { font-family: 'Courier Prime', monospace; font-size: 9.5px; color: var(--muted); margin-top: 2px; line-height: 1.5; letter-spacing: 0.02em; white-space: pre-line; }
  .price { font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 600; color: var(--ink); letter-spacing: 0.02em; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0 32px; }

  .notes-box { background: var(--fill); border-left: 3px solid var(--ink); padding: 14px 16px; margin-bottom: 18px; }
  .notes-label { font-family: 'Courier Prime', monospace; font-size: 9px; letter-spacing: 0.22em; color: var(--ink); text-transform: uppercase; margin-bottom: 4px; }
  .notes-text { font-family: 'Courier Prime', monospace; font-size: 10px; color: var(--muted); line-height: 1.7; letter-spacing: 0.02em; white-space: pre-line; }

  .footer { padding: 18px 0 0; border-top: 2px solid var(--ink); display: flex; justify-content: space-between; align-items: flex-end; }
  .footer-left { font-family: 'Courier Prime', monospace; font-size: 8.5px; letter-spacing: 0.16em; color: var(--muted); text-transform: uppercase; line-height: 1.9; white-space: pre-line; }
  .footer-right { font-family: 'Playfair Display', serif; font-style: italic; font-size: 10.5px; color: var(--muted); text-align: right; line-height: 1.6; white-space: pre-line; }
  /* ===== END SHEET STYLES ===== */

  /* ── STICKY EXPORT BAR ── */
  .export-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--app-bg);
    border-top: 1px solid var(--app-line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    display: flex;
    gap: 10px;
    z-index: 30;
  }
  .btn {
    flex: 1;
    font-family: 'Courier Prime', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 13px 0;
    border-radius: 7px;
    border: none;
    cursor: pointer;
  }
  .btn-primary { background: var(--app-ink); color: var(--app-bg); }
  .btn-primary:active { background: #000; }
  .btn-primary[disabled] { opacity: 0.6; }

  .toast {
    position: fixed;
    bottom: 90px; left: 50%;
    transform: translateX(-50%);
    background: var(--app-ink);
    color: #fff;
    font-size: 11px;
    padding: 9px 16px;
    border-radius: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 40;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  @media (min-width: 720px) {
    .app-header, .panel { padding-left: 32px; padding-right: 32px; }
    .export-bar { padding-left: 32px; padding-right: 32px; }
  }
</style>
</head>
<body>

  <div class="app-header">
    <div class="app-title-row">
      <div>
        <div class="app-title">Western <span>Rewind</span></div>
        <div class="app-subtitle">Pricing Sheet Editor</div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="edit">Edit</button>
      <button class="tab-btn" data-tab="preview">Preview</button>
    </div>
  </div>

  <!-- EDIT PANEL -->
  <div class="panel active" id="edit-panel">
    <div class="locked-hint">Item names, descriptions and prices are yours to edit. Layout, fonts and colors are locked so every sheet stays on-brand. Uncheck "show on sheet" to leave an item off without deleting it.</div>

    <div class="global-toggle-card">
      <span class="field-label">Header note (one-liner shown to the reader)</span>
      <input type="text" class="field-input" id="header-note-text" maxlength="140" style="margin-top:6px;">

      <label class="global-toggle" style="margin-top:12px;">
        <input type="checkbox" id="header-note-visible-toggle">
        <span>
          <span class="global-toggle-title">Show note on sheet</span>
        </span>
      </label>

      <label class="global-toggle" style="margin-top:10px;">
        <input type="checkbox" id="header-note-big-toggle">
        <span>
          <span class="global-toggle-title">Bigger text</span>
        </span>
      </label>

      <div class="header-note-position">
        <span class="field-label">Position</span>
        <div class="header-note-position-options">
          <label class="section-toggle">
            <input type="radio" name="header-note-position" id="header-note-pos-top" value="top">
            Above the menu
          </label>
          <label class="section-toggle">
            <input type="radio" name="header-note-position" id="header-note-pos-bottom" value="bottom">
            Below the menu (under Please Note)
          </label>
        </div>
      </div>
    </div>

    <div class="global-toggle-card">
      <label class="global-toggle">
        <input type="checkbox" id="starting-at-toggle">
        <span>
          <span class="global-toggle-title">Mark pricing as "Starting At"</span>
          <span class="global-toggle-sub">Adds a single note at the top of the document. Individual prices stay as-is.</span>
        </span>
      </label>
    </div>

    <div id="edit-sections"></div>

    <div class="edit-section">
      <div class="edit-section-title">Please Note</div>
      <div class="notes-edit">
        <label class="field-label">Notes box text</label>
        <textarea class="field-textarea" id="notes-text" rows="4"></textarea>
      </div>
    </div>

    <div class="reset-row">
      <button class="reset-btn" id="reset-btn">Reset all to original</button>
    </div>
  </div>

  <!-- PREVIEW PANEL -->
  <div class="panel" id="preview-panel">
    <div class="preview-frame">
      <div class="scale-wrap" id="scale-wrap">
        <div class="sheets-container" id="sheets-container"></div>
      </div>
    </div>
  </div>

  <div class="export-bar">
    <button class="btn btn-primary" id="export-btn">Export PDF</button>
  </div>
  <div class="toast" id="toast"></div>

<script>
/* ---------- DATA MODEL ---------- */
const DEFAULT_DATA = {
  sections: [
    { id: "band", label: "Live Band", layout: "full", visible: true, items: [
      { name: "Trio", desc: "Acoustic guitar, electric guitar, two vocals & drums — the full 90s country experience, stripped down and tight", price: "0", priceMax: "", visible: true },
      { name: "Four-Piece", desc: "Full energy and a full sound with bass, drums, electric guitar, acoustic guitar and 2 vocals", price: "0", priceMax: "", visible: true },
      { name: "Five-Piece", desc: "Full band — maximum energy, maximum impact including pedal steel, fiddle or keys", price: "0", priceMax: "", visible: true }
    ]},
    { id: "production", label: "Production", layout: "full", visible: true, items: [
      { name: "Ceremony Sound Package", desc: "2 lapel mics\nRecorded music · Onsite engineer", price: "0", priceMax: "", visible: true },
      { name: "Reception Sound Package", desc: "Full PA · Instruments & cables\nOnsite engineer · Break music\n2 speaker mics", price: "0", priceMax: "", visible: true },
      { name: "Stage Lighting", desc: "Full stage lighting package", price: "0", priceMax: "", visible: true }
    ]},
    { id: "dj", label: "DJ Services", layout: "half", visible: true, items: [
      { name: "Fixed Light DJ", desc: "Pre-set iPod playlist — curated & hands-off", price: "0", priceMax: "", visible: true },
      { name: "Light DJ", desc: "Manned iPod playlist — attendant present throughout", price: "0", priceMax: "", visible: true },
      { name: "Full DJ", desc: "Live mixing, request management, full DJ experience", price: "0", priceMax: "", visible: true }
    ]},
    { id: "addons", label: "Add-Ons", layout: "half", visible: true, items: [
      { name: "MC Services", desc: "Introductions, announcements & event flow", price: "0", priceMax: "", visible: true },
      { name: "Ceremony Music", desc: "Solo acoustic or acoustic + accompaniment\nProcessional, recessional & more", price: "0", priceMax: "", visible: true },
      { name: "Travel & Lodging", desc: "3 hotel rooms + fuel costs", price: "Quoted separately", visible: true, isNote: true }
    ]}
  ],
  notes: "All pricing is based on standard local engagements. Travel & lodging (3 hotel rooms + fuel) are billed above and beyond the package pricing shown above and will be itemized in your formal quote. Ceremony packages requiring a separate venue location are available — please inquire. Final pricing is confirmed in your signed agreement.",
  startingAt: false,
  headerNote: {

const STORAGE_KEY = "wr-pricing-data-v1";
let data = JSON.parse(JSON.stringify(DEFAULT_DATA));

function loadSaved() {
  try {
    const raw = sessionStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      // merge onto a fresh default so any field added after this session was
      // saved (e.g. a saved session from before "headerNote" existed) still
      // gets a safe default instead of coming back undefined
      data = Object.assign(JSON.parse(JSON.stringify(DEFAULT_DATA)), saved);
      // headerNote is nested, so a plain top-level merge isn't enough — merge
      // its fields individually too, or a session saved before "big" existed
      // would wipe out the default for "big" along with the rest of the object
      data.headerNote = Object.assign(
        JSON.parse(JSON.stringify(DEFAULT_DATA.headerNote)),
        saved.headerNote || {}
      );
    }
  } catch (e) { /* ignore, use defaults */ }
}
function persist() {
  try { sessionStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
}

/* ---------- VALIDATION: PRICE RANGES ---------- */
function stripLeadingZeros(inputEl) {
  const original = inputEl.value;
  const cursorPos = inputEl.selectionStart;
  // strip zeros that lead a longer number (e.g. "05" -> "5"), but leave a lone "0"
  // or a leading "0." (e.g. "0.5") alone since those are valid as typed
  const stripped = original.replace(/^0+(?=\d)/, "");
  if (stripped !== original) {
    const removedCount = original.length - stripped.length;
    inputEl.value = stripped;
    const newPos = Math.max(0, cursorPos - removedCount);
    inputEl.setSelectionRange(newPos, newPos);
  }
}

function parsePriceNum(str) {
  if (str === undefined || str === null) return NaN;
  const cleaned = String(str).replace(/[^0-9.]/g, "");
  if (cleaned === "") return NaN;
  return parseFloat(cleaned);
}

function isRangeInvalid(item) {
  if (item.isNote) return false;
  const maxStr = item.priceMax;
  if (maxStr === undefined || String(maxStr).trim() === "") return false;
  const p = parsePriceNum(item.price);
  const m = parsePriceNum(maxStr);
  if (isNaN(p) || isNaN(m)) return false;
  return m <= p;
}

// only items actually reaching the exported sheet block navigation to Preview
function collectInvalidPriceFields() {
  const invalid = [];
  data.sections.forEach((section, sIdx) => {
    if (!section.visible) return;
    section.items.forEach((item, iIdx) => {
      if (!item.visible) return;
      if (isRangeInvalid(item)) invalid.push({ section, item, sIdx, iIdx });
    });
  });
  return invalid;
}

/* ---------- RENDER: STYLED SHEET ---------- */
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

// Inserts thousands separators into a plain number string, at any magnitude
// (thousands, millions, billions, trillions, ...) by grouping digits in 3s
// from the decimal point outward — same idea as the classic "every 3rd digit"
// modulo approach, just expressed as a regex lookahead so there's no upper limit.
// Anything that isn't a clean number (e.g. free text) is returned untouched.
function formatWithCommas(value) {
  const str = String(value ?? "").trim();
  if (str === "") return "";
  const cleaned = str.replace(/,/g, "");
  if (!/^-?\d+(\.\d+)?$/.test(cleaned)) return str; // not a plain number — leave as typed
  const negative = cleaned.startsWith("-");
  const abs = negative ? cleaned.slice(1) : cleaned;
  const [intPart, decPart] = abs.split(".");
  const withCommas = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (negative ? "-" : "") + withCommas + (decPart !== undefined ? "." + decPart : "");
}

// Decides whether a typed value is "trying to be a price" (only digits, commas,
// periods, whitespace, and optional $ signs) versus free text like "Ask us" or
// "Quoted separately". Numeric values get cleaned up and comma-formatted;
// anything else is left exactly as typed, with no $ sign added.
function parsePriceValue(str) {
  const withoutDollar = str.replace(/\$/g, "").trim();
  const looksNumeric = withoutDollar !== "" && /^[\d,.\s]+$/.test(withoutDollar);
  if (!looksNumeric) return { isNumeric: false, text: str.trim() };
  const cleaned = withoutDollar.replace(/[,\s]/g, "");
  return { isNumeric: true, formatted: formatWithCommas(cleaned) };
}

function formatPrice(item) {
  if (item.isNote) return escapeHtml(item.price);

  const priceStr = String(item.price ?? "").trim();
  if (priceStr === "") return ""; // blank price — no $ sign, nothing shown

  const priceInfo = parsePriceValue(priceStr);
  if (!priceInfo.isNumeric) return escapeHtml(priceInfo.text); // free text — no $ sign

  const hasMax = item.priceMax !== undefined && String(item.priceMax).trim() !== "";
  if (hasMax) {
    const maxInfo = parsePriceValue(String(item.priceMax).trim());
    if (maxInfo.isNumeric) {
      return "$" + escapeHtml(priceInfo.formatted) + " - $" + escapeHtml(maxInfo.formatted);
    }
    // max price isn't a clean number — fall back to showing just the single price
  }
  return "$" + escapeHtml(priceInfo.formatted);
}

function buildSectionEl(section) {

/* ---------- PAGINATION ---------- */
// A "row" is one unit that can never be split across pages: either a single
// full-width section, or a pair of half-width sections sitting side by side.
function buildRows() {
  const sections = data.sections.filter(s => s.visible);
  const rows = [];
  let i = 0;
  while (i < sections.length) {
    const s = sections[i];
    if (s.layout === "half" && sections[i + 1] && sections[i + 1].layout === "half") {
      const row = document.createElement("div");
      row.className = "two-col";
      row.appendChild(buildSectionEl(s));
      row.appendChild(buildSectionEl(sections[i + 1]));
      rows.push(row);
      i += 2;
    } else {
      rows.push(buildSectionEl(s));
      i += 1;
    }
  }
  return rows;
}

// Available vertical space for content inside one page, i.e. the page height
// minus the page-wrap's own top/bottom padding.
const PAGE_HEIGHT = 1056;
const PAGE_PAD = 56;
const CONTENT_HEIGHT = PAGE_HEIGHT - PAGE_PAD * 2; // 944

// Measures an element's rendered height at real page content width (672px,
// i.e. 816 minus the page-wrap's left/right padding) without it ever being
// visible, by attaching it off-screen, reading its height, then detaching it.
function measureHeight(el) {
  const stage = document.createElement("div");
  stage.style.position = "absolute";
  stage.style.left = "-9999px";
  stage.style.top = "0";
  stage.style.width = "672px";
  stage.className = "sheet";
  stage.style.height = "auto";
  document.body.appendChild(stage);
  stage.appendChild(el);
  const height = el.offsetHeight;
  stage.removeChild(el);
  document.body.removeChild(stage);
  return height;
}

// Measures the cumulative bottom offset of each row if they were stacked
// starting at position 0 (i.e. how far down row i's bottom edge would sit).
// This is position-independent — the same numbers apply whether the rows end
// up starting right after a full header or a mini-header, since rows only
// carry their own margin-bottom (no margin-top to collapse against whatever
// precedes them).
function measureRowBottoms(rows) {
  const stage = document.createElement("div");
  stage.style.position = "absolute";
  stage.style.left = "-9999px";
  stage.style.top = "0";
  stage.style.width = "672px";
  stage.className = "sheet";
  stage.style.height = "auto";
  document.body.appendChild(stage);
  rows.forEach(r => stage.appendChild(r));
  const bottoms = rows.map(r => r.offsetTop + r.offsetHeight);
  rows.forEach(r => stage.removeChild(r));
  document.body.removeChild(stage);
  return bottoms;
}

function buildPageEl(bodyChildren) {
  const sheet = document.createElement("div");
  sheet.className = "sheet";
  const pageWrap = document.createElement("div");
  pageWrap.className = "page-wrap";
  bodyChildren.forEach(el => pageWrap.appendChild(el));
  sheet.appendChild(pageWrap);
  return sheet;
}

// Pure measurement pass — decides how many pages are needed and how many
// rows land on page 1, without building or attaching any lasting DOM. The
// rows built here exist only long enough to be measured, then are discarded;
// actual display always builds its own fresh row elements from this plan.
function computeSplitPlan() {
  const rows = buildRows();
  const showTopNote = data.headerNote.visible && data.headerNote.position === "top";

  const headerHeight = measureHeight(buildHeaderEl());
  const topNoteHeight = showTopNote ? measureHeight(buildTopNoteEl()) : 0;
  const footerGroupHeight = measureHeight(buildFooterGroupEl());
  const rowBottoms = rows.length ? measureRowBottoms(rows) : [];

  const spaceBeforeRowsPage1 = headerHeight + topNoteHeight;

  // How many rows fit on page 1 using only the header (not the footer group)
  // as the space-before — this is "how much menu naturally fits on one page."
  let splitIndex = -1; // last row index that fits on page 1; -1 means none
  for (let i = 0; i < rowBottoms.length; i++) {
    if (spaceBeforeRowsPage1 + rowBottoms[i] <= CONTENT_HEIGHT) splitIndex = i;
    else break;
  }

  const totalRows = rows.length;
  const allRowsFitPage1 = splitIndex === totalRows - 1;
  const lastRowBottom = totalRows ? rowBottoms[totalRows - 1] : 0;
  const wholeDocumentFits = allRowsFitPage1 &&
    (spaceBeforeRowsPage1 + lastRowBottom + footerGroupHeight <= CONTENT_HEIGHT);

  if (wholeDocumentFits) {
    return { pageCount: 1, page1RowCount: totalRows, footerOnPage: 0, showTopNote };
  } else if (allRowsFitPage1) {
    return { pageCount: 2, page1RowCount: totalRows, footerOnPage: 1, showTopNote };
  } else {
    return { pageCount: 2, page1RowCount: splitIndex + 1, footerOnPage: 1, showTopNote };
  }
}

// Builds ONE page's content fresh (new elements every call — never reuses a
// node that might already be attached elsewhere) given the plan and which
// page index (0-based) is being built.
function buildPageContentEl(pageIndex, plan) {
  const allRows = buildRows(); // fresh instances every call, by design
  const page1Rows = allRows.slice(0, plan.page1RowCount);
  const page2Rows = allRows.slice(plan.page1RowCount);

  if (pageIndex === 0) {
    const children = [buildHeaderEl()];
    if (plan.showTopNote) children.push(buildTopNoteEl());
    if (page1Rows.length) {
      const sectionsCol = document.createElement("div");
      sectionsCol.className = "sheet-sections-col";
      page1Rows.forEach(r => sectionsCol.appendChild(r));
      children.push(sectionsCol);
    }
    if (plan.footerOnPage === 0) children.push(buildFooterGroupEl());
    return buildPageEl(children);
  } else {
    const children = [buildMiniHeaderEl()];
    if (page2Rows.length) {
      const sectionsCol = document.createElement("div");
      sectionsCol.className = "sheet-sections-col";
      page2Rows.forEach(r => sectionsCol.appendChild(r));
      children.push(sectionsCol);
    }
    if (plan.footerOnPage === 1) children.push(buildFooterGroupEl());
    return buildPageEl(children);
  }
}

function renderSheet() {
  const container = document.getElementById("sheets-container");
  container.innerHTML = "";

  const plan = computeSplitPlan();
  for (let i = 0; i < plan.pageCount; i++) {
    container.appendChild(buildPageContentEl(i, plan));
  }

  // page numbers only matter once there's more than one page to keep straight
  const pageEls = Array.from(container.children);
  if (pageEls.length > 1) {
    pageEls.forEach((pageEl, idx) => {
      const num = document.createElement("div");
      num.className = "page-number";
      num.textContent = `Page ${idx + 1} of ${pageEls.length}`;
      pageEl.appendChild(num);
    });
  }
}

/* ---------- SCALE PREVIEW TO FIT SCREEN ---------- */
function scalePreview() {
  const frame = document.querySelector(".preview-frame");
  const container = document.getElementById("sheets-container");
  const scaleWrap = document.getElementById("scale-wrap");
  const available = frame.clientWidth - 24;
  const sheetWidth = 816;
  const scale = Math.min(1, available / sheetWidth);
  scaleWrap.style.transform = `scale(${scale})`;
  scaleWrap.style.width = sheetWidth + "px";
  const naturalHeight = container.offsetHeight;
  frame.style.height = (naturalHeight * scale) + 32 + "px";
}

/* ---------- TABS ---------- */
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    if (btn.dataset.tab === "preview") {
      const invalid = collectInvalidPriceFields();
      if (invalid.length > 0) {
        showToast("Fix the highlighted price range" + (invalid.length > 1 ? "s" : "") + " first");
        const first = invalid[0];
        const el = document.getElementById(`max-price-${first.section.id}-${first.iIdx}`);
        if (el) {
          el.scrollIntoView({ behavior: "smooth", block: "center" });
          el.focus();
          el.classList.add("field-input-error");
        }
        return; // block the tab switch
      }
    }

    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    document.getElementById(btn.dataset.tab + "-panel").classList.add("active");
    if (btn.dataset.tab === "preview") {
      requestAnimationFrame(scalePreview);
    }
  });
});

/* ---------- RESET ---------- */
document.getElementById("reset-btn").addEventListener("click", () => {
  if (!confirm("Reset every field back to the original pricing sheet? This can't be undone.")) return;
  data = JSON.parse(JSON.stringify(DEFAULT_DATA));
  persist();
  renderEditForm();
  renderSheet();
  showToast("Reset to original");
});

/* ---------- TOAST ---------- */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ---------- EXPORT PDF ---------- */
document.getElementById("export-btn").addEventListener("click", async () => {
  const invalidOnExport = collectInvalidPriceFields();
  if (invalidOnExport.length > 0) {
    showToast("Fix the highlighted price range" + (invalidOnExport.length > 1 ? "s" : "") + " first");
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === "edit"));
    document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "edit-panel"));
    const first = invalidOnExport[0];
    const el = document.getElementById(`max-price-${first.section.id}-${first.iIdx}`);
    if (el) {
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      el.focus();
      el.classList.add("field-input-error");
    }
    return;
  }

  const btn = document.getElementById("export-btn");
  btn.disabled = true;
  btn.textContent = "Preparing…";

  // render sheets at natural (unscaled) size for export, off the visible scale transform
  const container = document.getElementById("sheets-container");
  const scaleWrap = document.getElementById("scale-wrap");
  const prevTransform = scaleWrap.style.transform;
  scaleWrap.style.transform = "none";

  // html2canvas captures relative to the page's current scroll offset — if the
  // page is scrolled when export runs, it can miscalculate bounds and grab only
  // part of the sheet. Force the page to the top and pin the capture origin
  // before shooting, then restore wherever the user was afterward.
  const prevScrollX = window.scrollX;
  const prevScrollY = window.scrollY;
  window.scrollTo(0, 0);
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

  const html2canvasOpt = {
    scale: 2,
    useCORS: true,
    backgroundColor: "#FAFAF8",
    scrollX: 0,
    scrollY: 0
  };

  const opt = {
    margin: 0,
    filename: "western-rewind-pricing.pdf",
    image: { type: "jpeg", quality: 0.98 },
    html2canvas: html2canvasOpt,
    jsPDF: { unit: "in", format: "letter", orientation: "portrait" }
  };

  try {
    // Build and capture ONE page at a time, from a container that's cleared
    // and rebuilt fresh for each page — no two pages are ever in the DOM
    // together during a capture, even briefly. Two earlier attempts (moving
    // page 2 into an isolated fixed-position container, and hiding page 1
    // with display:none while page 2 stayed in the live 2-page container)
    // both produced the exact same bug: the second capture measured exactly
    // double the correct page height. Since that happened identically both
    // times, the issue wasn't really about what sat next to page 2 in the
    // DOM — it pointed at something in calling html2pdf a second time in
    // the same session. Rebuilding the container from scratch for each page
    // sidesteps that entirely, since every capture is now a completely
    // independent, single-page-only build.
    //
    // Every page's canvas is rendered through html2pdf's own worker chain
    // (toCanvas/toPdf + .get) rather than calling html2canvas directly — the
    // bundled CDN build doesn't necessarily expose html2canvas as a bare
    // global, only html2pdf's own internal API is guaranteed to be there.
    const plan = computeSplitPlan();
    let pdf = null;
    let pageWidth = 0;
    let pageHeight = 0;

    for (let i = 0; i < plan.pageCount; i++) {
      container.innerHTML = "";
      container.appendChild(buildPageContentEl(i, plan));
      const pageEl = container.children[0];

      if (plan.pageCount > 1) {
        const num = document.createElement("div");
        num.className = "page-number";
        num.textContent = `Page ${i + 1} of ${plan.pageCount}`;
        pageEl.appendChild(num);
      }

      if (i === 0) {
        pdf = await html2pdf().set(opt).from(pageEl).toPdf().get("pdf");
        pageWidth = pdf.internal.pageSize.getWidth();
        pageHeight = pdf.internal.pageSize.getHeight();
      } else {
        const canvas = await html2pdf().set(opt).from(pageEl).toCanvas().get("canvas");
        const imgData = canvas.toDataURL("image/jpeg", 0.98);
        pdf.addPage();
        pdf.addImage(imgData, "JPEG", 0, 0, pageWidth, pageHeight);
      }
    }

    pdf.save(opt.filename);
    showToast("PDF downloaded");
  } catch (e) {
    console.error("PDF export failed:", e);
    showToast("Export failed — try again");
  } finally {
    // rebuild the real (possibly multi-page) live preview, since the
    // container was just used as a single-page scratch space during export
    renderSheet();
    scaleWrap.style.transform = prevTransform;
    window.scrollTo(prevScrollX, prevScrollY);
    btn.disabled = false;
    btn.textContent = "Export PDF";
    requestAnimationFrame(scalePreview);
  }
});

/* ---------- INIT ---------- */
window.addEventListener("resize", () => {
  if (document.getElementById("preview-panel").classList.contains("active")) scalePreview();
});

loadSaved();
renderEditForm();
renderSheet();
requestAnimationFrame(scalePreview);
</script>
</body>
